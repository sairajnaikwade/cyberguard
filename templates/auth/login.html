{% extends "base.html" %}
{% block title %}Login — CyberGuard{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">⬡ CyberGuard</div>
    <h2 class="auth-title">Sign in</h2>
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" required autocomplete="username"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" required autocomplete="current-password"/>
      </div>
      <label class="checkbox-label">
        <input type="checkbox" name="remember"/> Remember me
      </label>
      <button type="submit" class="btn btn-primary btn-full">Log in</button>
    </form>
    <p class="auth-footer">No account? <a href="{{ url_for('auth.register') }}">Register</a></p>
  </div>
</div>
{% endblock %}
